<style>
  /* ===== 色彩與基本設定（暖黃、橘白、薄荷綠） ===== */
  :root {
    --bg: #fff6dd; --card: #ffffff; --ink: #3b2a1a; --muted: #8a7358;
    --orange: #ff8a3d; --orange-d: #e5701f; --mint: #4fc9a4; --mint-l: #dff6ee;
    --line: #f3e3bd; --shadow: 0 10px 30px rgba(190, 120, 30, .15);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2a2014; --card: #3a2c1c; --ink: #fff1d6; --muted: #d4b98c;
            --mint-l: #23463c; --line: #55402a; --shadow: 0 10px 30px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: radial-gradient(circle at 15% 10%, rgba(255,200,80,.35), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(79,201,164,.25), transparent 45%), var(--bg);
    padding: 24px 16px 40px;
  }
  h1 { text-align: center; margin: 0 0 4px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 1.05rem; }

  /* ===== 版面：電腦並排，手機上下堆疊 ===== */
  .layout { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: 1.15fr 1fr; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 24px; }

  /* ===== 輪盤 ===== */
  .wheel-card { text-align: center; }
  /* 菜單模式的提示列：顯示目前是哪家店，並提供返回按鈕 */
  .mode-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; background: var(--mint-l); border-radius: 16px; padding: 10px 14px; margin-bottom: 14px; text-align: left; font-weight: 700; }
  .mode-bar.show { display: flex; }
  .mode-bar button { font: inherit; font-weight: 700; border: 2px solid var(--mint); color: var(--ink); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
  .mode-bar button:hover { background: var(--mint); color: #fff; }
  .wheel-wrap { position: relative; width: min(100%, 420px); aspect-ratio: 1; margin: 8px auto 20px; }
  #wheel { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 8px #fff, 0 0 0 12px var(--orange), 0 12px 30px rgba(0,0,0,.2); }
  .wheel-wrap.menu #wheel { box-shadow: 0 0 0 8px #fff, 0 0 0 12px var(--mint), 0 12px 30px rgba(0,0,0,.2); }
  .pointer { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 2;
    border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 40px solid #e5393b;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  .hub { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; transform: translate(-50%,-50%); border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 5px var(--orange), 0 4px 10px rgba(0,0,0,.25); display: grid; place-items: center; font-size: 1.9rem; }
  .wheel-wrap.menu .hub { box-shadow: 0 0 0 5px var(--mint), 0 4px 10px rgba(0,0,0,.25); }
  .btn-spin { font: inherit; font-size: 1.3rem; font-weight: 800; color: #fff; border: 0; cursor: pointer; padding: 14px 44px; border-radius: 999px;
    background: linear-gradient(180deg, #ffa05a, var(--orange-d)); box-shadow: 0 6px 0 #b9560f, 0 10px 18px rgba(229,112,31,.4); transition: transform .1s, box-shadow .1s; }
  .btn-spin:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #b9560f; }
  .btn-spin:disabled { background: #cfc6b8; box-shadow: 0 6px 0 #a89f91; cursor: not-allowed; color: #f4efe6; }
  /* 選完早餐店後，常駐在輪盤下方的「抽菜單」按鈕（不怕彈窗被關掉） */
  .btn-menu { display: block; margin: 16px auto 0; font: inherit; font-size: 1.15rem; font-weight: 800; color: #fff; border: 0; cursor: pointer; padding: 12px 28px; border-radius: 999px; background: linear-gradient(180deg, #6fdcb9, var(--mint)); box-shadow: 0 5px 0 #2f9c7d, 0 8px 16px rgba(47,156,125,.35); max-width: 100%; }
  .btn-menu:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #2f9c7d; }
  .btn-menu:disabled { background: #cfc6b8; box-shadow: 0 5px 0 #a89f91; cursor: not-allowed; }
  li.store.picked { outline: 3px solid var(--mint); }
  .hint { min-height: 1.5em; margin: 14px 0 0; color: #d9452b; font-weight: 600; }

  /* ===== 名單管理 ===== */
  .list-card h2 { margin: 0 0 14px; font-size: 1.35rem; }
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: transparent; color: var(--ink); }
  .add-row input:focus { outline: none; border-color: var(--mint); }
  .btn-add { font: inherit; font-weight: 700; color: #fff; background: var(--mint); border: 0; border-radius: 14px; padding: 0 18px; cursor: pointer; white-space: nowrap; }
  .btn-add:hover { filter: brightness(.95); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li.store { padding: 10px 12px; border-radius: 14px; background: var(--mint-l); font-size: 1.05rem; }
  li.store.current { outline: 3px solid var(--orange); }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .name { flex: 1; overflow-wrap: anywhere; }
  .badge { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .icon-btn { border: 0; background: transparent; font-size: 1.15rem; cursor: pointer; padding: 5px 7px; border-radius: 8px; color: var(--ink); }
  .icon-btn:hover { background: rgba(255,138,61,.25); }
  .icon-btn.del:hover { background: rgba(229,57,59,.18); }
  .icon-btn[aria-expanded="true"] { background: var(--orange); }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* 展開的店家菜單編輯區 */
  .menu-panel { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--card); border: 2px dashed var(--line); }
  .menu-panel h3 { margin: 0 0 8px; font-size: 1rem; }
  .menu-panel ul { gap: 6px; margin-bottom: 10px; }
  .menu-panel li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--mint-l); font-size: 1rem; }
  .menu-panel .empty { color: var(--muted); font-size: .95rem; margin: 0 0 10px; }
  .menu-panel .add-row { margin: 0; }
  .menu-panel .add-row input { padding: 9px 12px; font-size: 1rem; }
  .menu-panel .btn-add { padding: 0 14px; background: var(--orange); }
  .count { color: var(--muted); font-size: .95rem; margin-top: 12px; }

  /* ===== 得獎彈窗 ===== */
  .modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(40,25,10,.55); z-index: 20; padding: 16px; }
  .modal.show { display: grid; }
  .modal-box { background: var(--card); border-radius: 28px; padding: 32px 28px; text-align: center; max-width: 380px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.4); animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box .emoji { font-size: 3.2rem; }
  .modal-box p { margin: 6px 0; color: var(--muted); }
  .modal-box .win { font-size: clamp(1.7rem, 7vw, 2.2rem); font-weight: 900; color: var(--orange-d); margin: 8px 0 20px; overflow-wrap: anywhere; }
  .modal-actions { display: grid; gap: 10px; }
  .modal-actions button { font: inherit; font-weight: 700; padding: 12px 24px; border: 0; border-radius: 999px; color: #fff; cursor: pointer; font-size: 1.1rem; }
  #goMenuBtn { background: var(--orange-d); }
  #backBtn { background: var(--orange-d); }
  #closeBtn { background: var(--mint); }
  #rerollBtn { background: var(--orange); }
  /* 價格篩選列：只在菜單輪盤模式顯示 */
  .price-filter { display: none; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .price-filter.show { display: flex; }
  .price-filter span { font-weight: 700; margin-right: 4px; }
  .price-filter button { font: inherit; font-weight: 700; border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .price-filter button.active { background: var(--mint); border-color: var(--mint); color: #fff; }
  .price-filter button:disabled { opacity: .5; cursor: not-allowed; }
  .menu-panel .price { color: var(--muted); font-size: .9rem; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  button:focus-visible, input:focus-visible { outline: 3px solid #2f80ed; outline-offset: 2px; }
</style>

        <button data-v="low">50 元以下</button>

      </div>
      <div id="wheelWrap" class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="1680" height="1680"></canvas>
        <div id="hub" class="hub">☀️</div>
      </div>
      <button id="spinBtn" class="btn-spin">開始抽籤</button>
      <button id="goMenuInline" class="btn-menu" style="display:none"></button>
      <p id="hint" class="hint" role="status"></p>
    </section>

    <!-- 右側：店家名單（每家可展開編輯菜單） -->
    <section class="card list-card">
      <h2>早餐店名單</h2>
      <ul id="list"></ul>
      <p id="count" class="count"></p>
    </section>
  </main>

  <!-- 結果彈窗（店家結果 / 餐點結果共用） -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div id="winEmoji" class="emoji">🎉</div>
      <p id="winTitle">今天就吃：</p>
      <div id="winName" class="win"></div>
      <div class="modal-actions">
        <button id="goMenuBtn">🍽️ 抽這家吃什麼？</button>
        <button id="rerollBtn">🔄 再抽一次</button>
        <button id="backBtn">↩ 返回店家輪盤</button>
        <button id="closeBtn">好，出發！</button>
      </div>
      <p id="winNote"></p>
    </div>
  </div>
  <canvas id="confetti"></canvas>

  const spinBtn = $('spinBtn'), hint = $('hint');
  const findStore = name => stores.find(s => s.name === name);

  // 目前價格條件下的菜單，回傳 [[名稱, 價格], ...]；價格為 null 的只在「不限」出現
  function menuItems() {
    const s = findStore(curName);
    if (!s) return [];
    return s.menu.filter(({ price: p }) => {
      if (priceFilter === 'all') return true;
      if (typeof p !== 'number') return false;
      return priceFilter === 'low' ? p <= PRICE_LIMIT : p > PRICE_LIMIT;
    });
  }
  // 目前輪盤上的項目：店家輪盤 = [{name}]；菜單輪盤 = 符合價格的「全部」餐點 [{name, price}]
  function items() {
    return mode === 'menu' ? menuItems() : stores.map(s => ({ name: s.name }));
  }

  // 扇形顏色（避免最後一塊與第一塊同色）；pal 可指定店家色盤或菜單色盤
  function colorOf(i, n, pal = COLORS) {
    let c = i % pal.length;
    if (i === n - 1 && i > 0 && c === 0) c = 2;
    return pal[c];
  }
  // 文字換行：每行 LINE_CHARS 字，最多 MAX_LINES 行，超過就在最後加「…」（需求 4）
  function wrapText(str) {
    const chars = Array.from(str);
    const out = [];
    for (let i = 0; i < chars.length && out.length < MAX_LINES; i += LINE_CHARS) out.push(chars.slice(i, i + LINE_CHARS).join(''));
    if (chars.length > LINE_CHARS * MAX_LINES) out[MAX_LINES - 1] = Array.from(out[MAX_LINES - 1]).slice(0, -1).join('') + '…';
    return out;
  }

  // 產生輪盤上的文字行：店家只有店名；菜單會在品名後面加上金額（需求：品項後面加金額）
  function labelLines(it, n) {
    const price = typeof it.price === 'number' ? '$' + it.price : '';
    if (n > DENSE_N) return [price ? it.name + ' ' + price : it.name];   // 扇形很多：單行「品名 $價格」
    const lines = wrapText(it.name);
    if (price) {
      const last = lines[lines.length - 1];
      if (Array.from(last).length + 1 + price.length <= LINE_CHARS + 2) lines[lines.length - 1] = last + ' ' + price;
      else lines.push(price);                                           // 放不下就把金額獨立一行
    }
    return lines;
  }

  // ===== 繪製輪盤 =====
  function drawWheel() {
    const list = items(), n = list.length, size = 840, r = size / 2;   // 邏輯座標固定 840，畫布實際是 2 倍解析度
    const k = canvas.width / size;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, size, size);
    if (n === 0) { ctx.fillStyle = '#f3e3bd'; ctx.beginPath(); ctx.arc(r, r, r, 0, 7); ctx.fill(); return; }
    const arc = (Math.PI * 2) / n, dense = n > DENSE_N;
    const lw = n > 60 ? 0.8 : n > 30 ? 1.5 : n > 16 ? 2.5 : 4;          // 扇形越多，分隔線越細
    list.forEach((it, i) => {
      ctx.beginPath(); ctx.moveTo(r, r);
      ctx.arc(r, r, r, i * arc, (i + 1) * arc); ctx.closePath();
      ctx.fillStyle = colorOf(i, n, mode === 'menu' ? MENU_COLORS : COLORS); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = lw; ctx.stroke();
      ctx.save();
      ctx.translate(r, r); ctx.rotate(i * arc + arc / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#3b2a1a';
      // 字級依「行數、最長行字數、扇形寬度」自動縮放；扇形再多也會全部列出
      const lines = labelLines(it, n);
      const longest = Math.max(...lines.map(l => Array.from(l).length));
      const fs = Math.max(5, Math.min(46, (dense ? 300 : 290) / longest, ((dense ? 300 : 230) * arc * 0.85) / (lines.length * 1.15)));
      ctx.font = `800 ${fs}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
      lines.forEach((ln, j) => ctx.fillText(ln, r - (dense ? 24 : 40), (j - (lines.length - 1) / 2) * fs * 1.15));
      ctx.restore();
    });
  }

  // ===== 右側名單渲染（點 🍽️ 展開查看菜單，唯讀）=====
  function renderList() {
    const ul = $('list'); ul.innerHTML = '';
    stores.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'store' + (mode === 'menu' && s.name === curName ? ' current' : '') + (mode === 'store' && s.name === lastWinnerName ? ' picked' : '');
      const row = document.createElement('div'); row.className = 'row';
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = colorOf(i, stores.length);
      const txt = document.createElement('span'); txt.className = 'name'; txt.textContent = s.name;
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = s.menu.length + ' 道菜';
      const menuBtn = document.createElement('button');
      menuBtn.className = 'icon-btn'; menuBtn.textContent = '🍽️';
      menuBtn.title = '查看菜單：' + s.name; menuBtn.setAttribute('aria-label', '查看菜單：' + s.name);
      menuBtn.setAttribute('aria-expanded', String(openName === s.name));
      menuBtn.onclick = () => { openName = openName === s.name ? '' : s.name; renderList(); };
      row.append(dot, txt, badge, menuBtn); li.appendChild(row);   // 不再有刪除按鈕
      if (openName === s.name) li.appendChild(buildMenuPanel(s));
      ul.appendChild(li);
    });
    $('count').textContent = `共 ${stores.length} 家早餐店`;
  }

  // 單一店家的菜單（唯讀，顯示價格）
  function buildMenuPanel(s) {
    const box = document.createElement('div'); box.className = 'menu-panel';
    const h = document.createElement('h3'); h.textContent = s.name + ' 的菜單'; box.appendChild(h);
    const ul = document.createElement('ul');
    s.menu.forEach(({ name, price }) => {
      const li = document.createElement('li');
      const t = document.createElement('span'); t.className = 'name'; t.textContent = name;
      const p = document.createElement('span'); p.className = 'price'; p.textContent = typeof price === 'number' ? '$' + price : '';
      li.append(t, p); ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  // ===== 整體渲染 =====
  function render() { renderList(); drawWheel(); updateUI(); }

  // 依目前模式更新標題、按鈕、提示
  function updateUI() {
    const n = items().length, ok = n >= 2, isMenu = mode === 'menu';
    $('modeBar').classList.toggle('show', isMenu);
    $('priceFilter').classList.toggle('show', isMenu);
    document.querySelectorAll('#priceFilter button').forEach(b => {
      b.classList.toggle('active', b.dataset.v === priceFilter);
      b.disabled = spinning;                       // 旋轉中不可改條件
    });
    $('wheelWrap').classList.toggle('menu', isMenu);
    $('hub').textContent = isMenu ? '🍽️' : '☀️';
    $('modeLabel').textContent = isMenu ? `🍽️ ${curName} 的菜單輪盤（${n} 道）` : '';
    spinBtn.textContent = isMenu ? '開始抽餐點' : '開始抽籤';
    spinBtn.disabled = spinning || !ok;
    // 選完店家後，輪盤下方常駐「抽這家的菜單」按鈕（彈窗關掉也還在）
    const showGo = !isMenu && lastWinnerName && findStore(lastWinnerName);
    $('goMenuInline').style.display = showGo ? '' : 'none';
    $('goMenuInline').textContent = showGo ? `🍽️ 抽「${lastWinnerName}」的菜單` : '';
    $('goMenuInline').disabled = spinning;
    $('toStoreBtn').disabled = spinning;
    if (!ok) hint.textContent = isMenu
      ? `目前條件下只有 ${n} 道餐點，至少要 2 道才能抽，請換個價格條件。`
      : '店家不足 2 家，無法抽籤。';
    else hint.textContent = '';
  }

  // ===== 輪盤模式切換 =====
  function resetWheel() { rotation = 0; canvas.style.transform = 'rotate(0deg)'; }
  function enterMenu(name) { mode = 'menu'; curName = name; priceFilter = 'all'; resetWheel(); render(); }   // 進入菜單時重設為「不限」
  function backToStore() { if (spinning) return; mode = 'store'; curName = ''; resetWheel(); render(); }
  $('toStoreBtn').onclick = backToStore;

  // ===== 價格篩選（需求 5）：點按鈕切換條件，輪盤立即重算 =====
  $('priceFilter').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || spinning) return;
    priceFilter = b.dataset.v;
    resetWheel(); render();
  });

  // ===== 抽籤動畫 =====
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function spin() {
    const list = items();
    if (spinning || list.length < 2) return;
    if (mode === 'store') lastWinnerName = '';   // 重抽店家時先清掉上一次的結果
    spinning = true; hint.textContent = ''; render();
    const n = list.length, arc = 360 / n;
    const winner = Math.floor(Math.random() * n);
    // 指針在正上方（畫布角度 270°），讓該扇形內的隨機一點停在指針處
    const targetAngle = (winner + 0.15 + Math.random() * 0.7) * arc;
    const delta = (((270 - targetAngle) - (rotation % 360)) % 360 + 360) % 360;
    const start = rotation, end = rotation + (5 + Math.floor(Math.random() * 3)) * 360 + delta;
    const duration = 3000 + Math.random() * 1000;
    const t0 = performance.now(), result = list[winner];   // 物件：{ name, price? }

    (function frame(now) {
      const t = Math.min((now - t0) / duration, 1);
      rotation = start + (end - start) * easeOut(t);
      canvas.style.transform = `rotate(${rotation}deg)`;
      if (t < 1) return requestAnimationFrame(frame);
      spinning = false; render(); showResult(result);
    })(t0);
  }
  spinBtn.onclick = spin;

  // ===== 結果彈窗 =====
  function showResult(item) {
    const name = item.name;
    const isMenu = mode === 'menu';
    if (!isMenu) { lastWinnerName = name; render(); }   // 記住店家並更新「抽菜單」按鈕
    $('winEmoji').textContent = isMenu ? '😋' : '🎉';
    $('winTitle').textContent = isMenu ? `今天在「${curName}」點：` : '今天就吃：';
    $('winName').textContent = name + (typeof item.price === 'number' ? ' $' + item.price : '') + '！';
    $('goMenuBtn').style.display = isMenu ? 'none' : '';
    $('backBtn').style.display = isMenu ? '' : 'none';
    $('rerollBtn').style.display = isMenu ? '' : 'none';   // 只有菜單結果才顯示「再抽一次」
    $('winNote').textContent = '';
    $('modal').classList.add('show');
    (isMenu ? $('closeBtn') : $('goMenuBtn')).focus();
    confetti();
  }
  const closeModal = () => $('modal').classList.remove('show');
  $('closeBtn').onclick = closeModal;
  $('backBtn').onclick = () => { closeModal(); backToStore(); };
  // 再抽一次：關閉彈窗後，用同一家店、同一個價格條件再轉一次
  $('rerollBtn').onclick = () => { closeModal(); spin(); };

  // 進入「這家店的菜單輪盤」：彈窗裡的按鈕與輪盤下方的常駐按鈕共用
  function goMenu() {
    if (spinning) return;
    const st = findStore(lastWinnerName);
    if (!st || st.menu.length < 2) {            // 菜單不足 2 道，不能進入菜單輪盤
      const msg = `「${lastWinnerName}」的菜單還不夠 2 道，暫時無法抽餐點。`;
      $('winNote').textContent = msg; hint.textContent = msg;
      return;
    }
    closeModal(); enterMenu(lastWinnerName);
  }
  $('goMenuBtn').onclick = goMenu;
  $('goMenuInline').onclick = goMenu;
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ===== 撒花效果 =====
  function confetti() {
    const cv = $('confetti'), c = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const parts = Array.from({ length: 140 }, () => ({
      x: cv.width / 2, y: cv.height * 0.4,
      vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    }));
    const t0 = performance.now();
    (function tick(now) {
      const life = now - t0;
      c.clearRect(0, 0, cv.width, cv.height);
      parts.forEach(p => {
        p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.globalAlpha = Math.max(0, 1 - life / 3500);
        c.fillStyle = p.color; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore();
      });
      if (life < 3500) requestAnimationFrame(tick); else c.clearRect(0, 0, cv.width, cv.height);
    })(t0);
  }

  render();
})();
</script>
</body>
</html>
